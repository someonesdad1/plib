# 13 Mar 2026:  This file has been changed to conform to advice given by Gemini related
# to doing /plib refactoring and avoiding 'ruff format' messing up math-heavy files like
# happened a year or two ago.  Note the "nuclear" choice of avoiding all formatting by
# ruff; this allows for opt-in formatting later for files where it doesn't matter as
# much.

# Gemini made a good architectural suggestion:  put all the math-heavy stuff in files
# with names that makes it easy to tell the formatter to ignore with lines like
#   exclude = [
#       "**/math_utils.py",
#       "**/physics/*.py",
#       "legacy_calculus_v1.py"
#   ]

# --------------------------------------------------------------------------- 
# Target Python version
target-version = "py311"
# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "Dev",
    "doc",
    "lib",
    "old",
    "test",
]

# --------------------------------------------------------------------------- 
[lint]
# Enable specific "Logic & Safety" categories:
# F: Pyflakes (Bugs like undefined variables)
# B: Bugbear (Common design pitfalls)
# I: Isort (Organizes imports - safe and useful)
# UP: Pyupgrade (Modernizes old syntax to 3.11)
select = ["F", "B", "I", "UP"]

# EXPLICITLY IGNORE rules that mess with whitespace/formatting:
ignore = [
    "E501", # Line too long (Let your math lines be as wide as they need to be)
    "E201", # Whitespace after '('
    "E202", # Whitespace before ')'
    "E203", # Whitespace before ':'
    "E221", # Multiple spaces before operator (Crucial for vertical alignment!)
    "E222", # Multiple spaces after operator
    "E241", # Multiple spaces after ','
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# --------------------------------------------------------------------------- 
[format]
# This is a "nuclear" option suggested by Gemini.  It excludes all ruff formatting by
# default.  Then you can later opt-in specific files as they are suitably refactored.
exclude = ["**/*.py"]

#line-length = 88
#indent-width = 4
#quote-style = "preserve"
## Indent with spaces, rather than tabs
#indent-style = "space"
## Allow trailing commas
#skip-magic-trailing-comma = false
## Use linefeeds on all files
#line-ending = "lf"
## Enable auto-formatting of code examples in docstrings. Markdown,
## reStructuredText code/literal blocks and doctests are all supported.
## This is currently disabled by default, but it is planned for this
## to be opt-out in the future.
#docstring-code-format = false
